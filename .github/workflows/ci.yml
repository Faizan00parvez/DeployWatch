name: DeployWatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r src/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
        contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deploywatch:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/deploywatch:${{ github.sha }}

      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|g" helm/deploywatch/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/deploywatch/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push