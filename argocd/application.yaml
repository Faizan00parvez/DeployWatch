apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploywatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Faizan00parvez/DeployWatch
    targetRevision: HEAD
    path: helm/deploywatch
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true